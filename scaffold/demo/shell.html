<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olive Branch — end-to-end demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --night:#12172B;--dawn:#E8A66B;--school:#2F6FB0;--day:#6BA8DE;--dusk:#8B6BB1;
  --overlap:#2F9E7E;--busy:#9AA6BA;--ban:#A3364A;--wip:#B8892B;
  --surface:#F4F6FA;--panel:#fff;--ink:#131722;--ink-2:#4A5468;--ink-3:#78829A;--rule:#DDE3ED;
  --mono:"IBM Plex Mono",ui-monospace,monospace;--sans:"IBM Plex Sans",system-ui,sans-serif;
  --display:"Fraunces",Georgia,serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--sans);
  font-size:15px;line-height:1.55;padding:0 20px 80px}
.wrap{max-width:1180px;margin:0 auto}

/* ---------------------------------------------------------------------------
   Galaxy Z Fold 5 — the target device, and it is two devices.
     cover  344 x 882 CSS  (904 x 2316 physical)  — extremely narrow
     main   673 x 841 CSS  (1812 x 2176 physical) — nearly square
   The breakpoints below are set from those numbers, not from generic
   phone/tablet guesses.
   --------------------------------------------------------------------------- */

/* Cover screen and anything narrower. Single column, tighter gutters, and no
   fixed width may exceed the viewport. */
@media (max-width: 480px){
  body{padding:0 12px 60px}
  .stage{grid-template-columns:1fr;gap:16px}
  .phone{position:static;width:100%;max-width:320px;margin:0 auto;height:640px}
  .mast{padding:24px 0 14px}
  .card{padding:16px 15px}
  .nav button{font-size:11.5px;padding:5px 8px}
  .ctl button{font-size:11.5px;padding:6px 9px}
  .real pre{font-size:10.5px}
  .modes{gap:6px}
  .mode{padding:8px 12px;font-size:12.5px}
  .live{width:100%;margin-left:0;order:3;font-size:10.5px}
}

/* Main screen: nearly square. Two columns fit, and the gutter is placed on the
   crease rather than content being laid across it. */
@media (min-width: 481px) and (max-width: 900px){
  body{padding:0 16px 60px}
  .stage{grid-template-columns:300px 1fr;gap:24px}
  .phone{position:static;width:290px;height:600px}
  .card{padding:16px 18px}
}
:focus-visible{outline:2px solid var(--overlap);outline-offset:2px}
button{font-family:var(--sans);cursor:pointer}

/* masthead */
.mast{padding:36px 0 18px;border-bottom:1px solid var(--rule);margin-bottom:22px}
.mast h1{font-family:var(--display);font-variation-settings:"SOFT" 40,"WONK" 1;
  font-weight:600;font-size:clamp(30px,5vw,46px);margin:0 0 6px;letter-spacing:-.02em}
.kick{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink-3)}
.modes{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.mode{border:1px solid var(--rule);background:var(--panel);border-radius:3px;
  padding:9px 15px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.mode.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.live{font-family:var(--mono);font-size:11px;color:var(--overlap);margin-left:auto;
  align-self:center}

/* layout */
.stage{display:grid;grid-template-columns:320px 1fr;gap:26px;align-items:start}

/* device */
.phone{width:300px;height:614px;background:var(--night);border-radius:34px;padding:9px;
  box-shadow:0 14px 44px -14px rgba(19,23,34,.5);position:sticky;top:16px}
.screen{width:100%;height:100%;background:var(--panel);border-radius:26px;overflow:hidden;
  display:flex;flex-direction:column;position:relative}
.phone.unfolded .screen{border-radius:16px}
/* The crease runs vertically down the centre of the unfolded screen. Marked so
   layout decisions about it are visible rather than accidental. */
.phone.unfolded .screen::after{content:"";position:absolute;left:50%;top:0;bottom:0;
  width:1px;background:linear-gradient(180deg,transparent,rgba(19,23,34,.07) 12%,
  rgba(19,23,34,.07) 88%,transparent);pointer-events:none;z-index:5}
.sb{display:flex;justify-content:space-between;padding:9px 15px 4px;
  font-family:var(--mono);font-size:9.5px;color:var(--ink-3);flex:none}
.sb .lk{color:var(--overlap);font-weight:600}
.body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.pad{padding:0 15px}
.hdr{font-family:var(--display);font-variation-settings:"SOFT" 40;font-weight:600;
  letter-spacing:-.01em}

/* nav */
.nav{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px}
.nav button{border:1px solid var(--rule);background:var(--panel);border-radius:3px;
  padding:6px 10px;font-size:12px;color:var(--ink-2)}
.nav button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.nav .grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--ink-3);width:100%;margin:8px 0 2px}

/* panel */
.side{min-width:0}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:3px;
  padding:20px 22px;margin-bottom:14px}
.card h2{font-family:var(--display);font-variation-settings:"WONK" 1;font-weight:500;
  font-size:21px;margin:0 0 8px;letter-spacing:-.01em}
.card p{margin:0 0 12px;font-size:14px;color:var(--ink-2);max-width:70ch}
.real{background:color-mix(in srgb,var(--overlap) 7%,var(--panel));
  border-left:3px solid var(--overlap);padding:12px 14px;margin:12px 0;border-radius:2px}
.real .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;color:#1B6B54;font-weight:600;margin-bottom:5px}
.real pre{margin:0;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);
  white-space:pre-wrap;word-break:break-word;line-height:1.6}
.wip{background:color-mix(in srgb,var(--wip) 10%,var(--panel));
  border-left:3px solid var(--wip);padding:12px 14px;margin:12px 0;border-radius:2px}
.wip .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;color:#8A6410;font-weight:600;margin-bottom:5px}
.wip p{margin:0;font-size:12.5px;color:var(--ink-2)}
.err{background:color-mix(in srgb,var(--ban) 8%,var(--panel));border-left:3px solid var(--ban);
  padding:12px 14px;border-radius:2px;font-family:var(--mono);font-size:11.5px}

/* controls */
.ctl{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.ctl button{border:1px solid var(--rule);background:var(--surface);border-radius:3px;
  padding:7px 12px;font-size:12.5px;color:var(--ink-2);font-weight:500}
.ctl button:hover{border-color:var(--ink-3)}
.ctl button.pri{background:var(--overlap);color:#fff;border-color:var(--overlap)}
.ctl button.dang{background:color-mix(in srgb,var(--ban) 10%,#fff);color:var(--ban);
  border-color:color-mix(in srgb,var(--ban) 35%,transparent)}

/* guided */
.steps{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.dots{display:flex;gap:4px;flex:1}
.dots i{height:3px;flex:1;background:var(--rule);border-radius:2px}
.dots i.done{background:var(--overlap)}
.dots i.cur{background:var(--ink)}
.stepn{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}

/* in-screen bits */
.row{display:flex;gap:9px;align-items:center;padding:10px 15px;
  border-bottom:1px solid var(--rule);font-size:13px}
.row .g{flex:1;min-width:0}
.row .t{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.chk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--rule);flex:none}
.chk.on{background:var(--overlap);border-color:var(--overlap);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:11px}
.seclbl{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);padding:13px 15px 5px}
.bar{height:19px;border-radius:2px;overflow:hidden;display:flex;background:var(--rule);
  position:relative}
.bar.thin{height:12px}
.seg{height:100%}
.ovl{position:relative;height:22px;margin-top:4px}
.ovband{position:absolute;top:0;height:18px;border-radius:2px;display:flex;align-items:center;
  justify-content:center;background:color-mix(in srgb,var(--overlap) 24%,transparent);
  border:1px solid var(--overlap)}
.ovband span{font-family:var(--mono);font-size:8px;font-weight:600;color:#1B6B54;
  white-space:nowrap;padding:0 4px}
.nowl{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);z-index:3}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:13px 15px}
.act{height:104px;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;
  padding:11px;color:#fff;font-weight:600;font-size:12.5px;border:0;text-align:left}
.act .ic{font-size:22px;margin-bottom:auto}
.pres{margin:11px 15px 0;padding:11px 13px;border-radius:12px;
  background:color-mix(in srgb,var(--overlap) 12%,var(--panel));
  border:1px solid color-mix(in srgb,var(--overlap) 45%,transparent)}
.cta{margin-top:9px;background:var(--overlap);color:#fff;border:0;border-radius:9px;
  padding:10px;width:100%;font-weight:600;font-size:13px}
.sleeps{margin:11px 15px;padding:10px 13px;border-radius:10px;background:var(--surface);
  display:flex;align-items:center;gap:10px}
.sleeps .n{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;color:var(--dusk)}
.blk{margin:11px 15px;padding:11px 12px;border-radius:10px;
  background:color-mix(in srgb,var(--ban) 9%,var(--panel));border-left:3px solid var(--ban)}
.blk .k{font-family:var(--mono);font-size:8.5px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ban);font-weight:600}
.blk p{margin:4px 0 0;font-size:12px;color:var(--ink-2)}
.ok{background:color-mix(in srgb,var(--overlap) 10%,var(--panel));border-left-color:var(--overlap)}
.ok .k{color:#1B6B54}
.veil{position:absolute;inset:0;background:rgba(19,23,34,.5);display:flex;align-items:flex-end;
  padding:13px}
.sheet{background:var(--panel);border-radius:16px;padding:16px;width:100%}
.btn{border:0;border-radius:10px;padding:10px;font-weight:600;font-size:12.5px;width:100%;
  margin-top:6px}
.btn.pri{background:var(--overlap);color:#fff}
.btn.sec{background:var(--surface);color:var(--ink-2);border:1px solid var(--rule)}
.btn.dang{background:color-mix(in srgb,var(--ban) 12%,#fff);color:var(--ban);
  border:1px solid color-mix(in srgb,var(--ban) 40%,transparent)}
.gate{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px;text-align:center;background:var(--night);color:#fff}
.keys{display:grid;grid-template-columns:repeat(3,50px);gap:8px}
.keys b{height:42px;border-radius:10px;background:rgba(255,255,255,.12);display:flex;
  align-items:center;justify-content:center;font-family:var(--mono);font-size:15px}
footer{border-top:1px solid var(--rule);margin-top:30px;padding-top:16px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);display:flex;
  justify-content:space-between;flex-wrap:wrap;gap:8px}


/* ---- live call layout. On the Fold's main screen the video and the board sit
   side by side with the gutter on the crease; on the cover screen they stack.
   The face is never covered in either. ---- */
.callwrap{display:flex;flex-direction:column;height:100%}
.callwrap.side{flex-direction:row}
.vid{background:linear-gradient(155deg,#2B3358,var(--night));position:relative;
  display:flex;align-items:flex-end;padding:8px;flex:none}
.callwrap.side .vid{width:50%;height:100%}
.callwrap.stack .vid{height:42%;width:100%}
.vid .who{font-family:var(--mono);font-size:9px;color:rgba(255,255,255,.75);
  background:rgba(0,0,0,.3);padding:2px 6px;border-radius:3px}
.vid .face{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:38px;opacity:.55}
.vid .pip{position:absolute;right:7px;top:7px;width:26%;aspect-ratio:3/4;border-radius:6px;
  background:#3A4470;border:1px solid rgba(255,255,255,.25)}
.board{flex:1;overflow-y:auto;background:var(--panel);padding:10px 12px}
.prompt{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.25;
  margin:2px 0 8px}
.conn{font-family:var(--mono);font-size:9.5px;padding:5px 8px;border-radius:4px;margin-bottom:8px}
.conn.poor{background:color-mix(in srgb,var(--wip) 16%,#fff);color:#8A6410}
.conn.lost{background:color-mix(in srgb,var(--ban) 10%,#fff);color:var(--ban)}


/* ---- child onboarding: big targets, no keyboard chrome ---- */
.ob{flex:1;display:flex;flex-direction:column;padding:16px 14px}
.obq{font-family:var(--display);font-variation-settings:"SOFT" 40;font-weight:600;
  font-size:21px;line-height:1.2;margin-bottom:4px}
.obs{font-size:12.5px;color:var(--ink-2);margin-bottom:14px}
.obname{font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:4px;
  min-height:46px;border-bottom:2px solid var(--rule);margin-bottom:14px;
  display:flex;align-items:center;color:var(--dusk)}
.obkeys{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.obkeys b{aspect-ratio:1;min-height:34px;border:1px solid var(--rule);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:14px;cursor:pointer;background:#fff}
.obnums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.obnums b{aspect-ratio:1;min-height:56px;border:1px solid var(--rule);border-radius:12px;
  display:flex;align-items:center;justify-content:center;font-family:var(--display);
  font-weight:700;font-size:22px;cursor:pointer;background:#fff}
.obnums b.on{background:var(--dusk);color:#fff;border-color:var(--dusk)}
.obwho{display:flex;flex-direction:column;gap:9px;margin-top:6px}
.obwho .p{display:flex;align-items:center;gap:11px;padding:13px;border-radius:14px;
  border:1px solid var(--rule);background:#fff}
.obwho .p.on{border-color:var(--overlap);background:color-mix(in srgb,var(--overlap) 9%,#fff)}
.obwho .av{width:44px;height:44px;border-radius:50%;background:linear-gradient(150deg,#2B3358,var(--night));
  display:flex;align-items:center;justify-content:center;font-size:21px;flex:none}


.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.pal b{aspect-ratio:1;border-radius:14px;cursor:pointer;display:flex;align-items:flex-end;
  padding:5px;font-family:var(--mono);font-size:7.5px;color:rgba(255,255,255,.92);
  line-height:1.1;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.pal b.on{outline:3px solid var(--ink);outline-offset:2px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.duo b{aspect-ratio:1;border-radius:20px;cursor:pointer;display:flex;align-items:flex-end;
  justify-content:center;padding:12px;font-family:var(--sans);font-weight:600;font-size:13px;
  color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4)}


.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mgrid b{aspect-ratio:1.25;border:1px solid var(--rule);border-radius:12px;display:flex;
  align-items:center;justify-content:center;font-family:var(--sans);font-weight:600;
  font-size:12.5px;cursor:pointer;background:#fff}
.mgrid b.hint{border-color:var(--dusk);border-width:2px;
  background:color-mix(in srgb,var(--dusk) 8%,#fff)}
.mgrid b.on{background:var(--dusk);color:#fff;border-color:var(--dusk)}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cgrid .h{font-family:var(--mono);font-size:8px;color:var(--ink-3);text-align:center;
  padding-bottom:2px;text-transform:uppercase;letter-spacing:.04em}
.cgrid b{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-family:var(--sans);font-weight:600;font-size:12px;
  cursor:pointer;background:#fff;border:1px solid var(--rule)}
.cgrid b.blank{background:transparent;border:0;cursor:default}
.cgrid b.on{background:var(--dusk);color:#fff;border-color:var(--dusk)}
.cgrid b.bday{position:relative}
.cgrid b.bday::after{content:"";position:absolute;bottom:3px;width:5px;height:5px;
  border-radius:50%;background:var(--marker,var(--dawn))}
.cgrid b.today{border-color:var(--ink);border-width:2px}


.stwrap{flex:1;display:flex;flex-direction:column;padding:14px 15px;overflow-y:auto}
.sttitle{font-family:var(--display);font-variation-settings:"SOFT" 40,"WONK" 1;
  font-weight:600;font-size:20px;line-height:1.15;margin-bottom:3px}
.stmeta{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);margin-bottom:12px;
  letter-spacing:.04em}
.stline{font-size:14.5px;line-height:1.62;margin-bottom:10px}
.stref{font-family:var(--display);font-weight:700;font-size:17px;line-height:1.3;
  margin:12px 0;padding:9px 12px;border-radius:10px;
  background:color-mix(in srgb,var(--herColour,var(--dusk)) 13%,transparent);
  border-left:3px solid var(--herColour,var(--dusk))}
.stref .who{font-family:var(--mono);font-size:8px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:3px;
  font-weight:400}


.pal8{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-bottom:10px}
.pal8 b{aspect-ratio:1;border-radius:7px;cursor:pointer;border:2px solid transparent}
.pal8 b.on{border-color:var(--ink);transform:scale(1.1)}
.findbox{position:relative;width:100%;aspect-ratio:1;border:1px solid var(--rule);
  border-radius:10px;overflow:hidden;background:#FBFAF7}
.findbox b{position:absolute;font-size:13px;cursor:pointer;line-height:1;
  transform:translate(-50%,-50%)}
.spotbox{position:relative;width:100%;aspect-ratio:1.35;border:1px solid var(--rule);
  border-radius:10px;background:linear-gradient(160deg,#EFF3F6,#F8F5EF);overflow:hidden;
  cursor:crosshair}
.spotbox i{position:absolute;width:34px;height:34px;border-radius:50%;
  border:2.5px solid var(--overlap);transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;font-style:normal;
  color:var(--overlap);font-weight:700;font-size:13px}
.bookpage{border:1px solid var(--rule);border-radius:10px;padding:12px;
  background:#FDFCFA;font-size:11.5px;line-height:1.65;max-height:210px;overflow-y:auto;
  white-space:pre-wrap;font-family:var(--mono);font-size:9.5px}


.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.gal b{aspect-ratio:1;border-radius:8px;border:1px solid var(--rule);background:#fff;
  display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;
  position:relative}
.gal b.hid{opacity:.35}
.gal b em{position:absolute;bottom:2px;right:3px;font-size:7px;font-style:normal;
  color:var(--ink-3);font-family:var(--mono)}
.galyr{font-family:var(--mono);font-size:9px;letter-spacing:.08em;color:var(--ink-3);
  text-transform:uppercase;margin:12px 0 6px}
.brf{border:1px solid var(--rule);border-radius:12px;padding:13px;background:#FDFCFA}
.brf li{font-size:13.5px;line-height:1.55;margin-bottom:6px;list-style:none;
  padding-left:13px;position:relative}
.brf li:before{content:"·";position:absolute;left:2px;font-weight:700;color:var(--dawn)}
.brf .op{margin-top:10px;padding-top:9px;border-top:1px solid var(--rule);
  font-family:var(--display);font-weight:600;font-size:14px}
.pill{display:inline-block;font-family:var(--mono);font-size:8.5px;padding:2px 6px;
  border-radius:3px;background:var(--panel);color:var(--ink-3);margin-right:4px}


.eng{border:1px solid var(--rule);border-radius:10px;margin-bottom:9px;overflow:hidden}
.eng>h4{margin:0;padding:9px 11px;background:var(--panel);font-family:var(--mono);
  font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);
  display:flex;justify-content:space-between;align-items:center}
.eng>h4 span{font-family:var(--sans);font-size:9px;letter-spacing:0;text-transform:none;
  color:var(--overlap);font-weight:600}
.eng .pr{padding:8px 11px;border-top:1px solid var(--rule);font-size:11.5px;line-height:1.55}
.eng .pr b{display:block;font-family:var(--mono);font-size:8.5px;color:var(--ink-3);
  text-transform:uppercase;letter-spacing:.05em;margin-bottom:3px;font-weight:400}
.eng .pr code{font-size:10px;background:var(--panel);padding:1px 4px;border-radius:3px;
  word-break:break-word}
.nodeonly{border:1px dashed var(--rule);border-radius:10px;padding:11px;margin-top:12px;
  background:color-mix(in srgb,var(--wip) 6%,transparent)}


.rung{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--rule)}
.rung:last-child{border-bottom:none}
.rung .age{width:34px;font-family:var(--display);font-weight:700;font-size:17px;
  text-align:right;color:var(--ink-3)}
.rung.on .age{color:var(--overlap)}
.rung .txt{flex:1;font-size:12.5px;line-height:1.45}
.rung.on .txt{font-weight:600}
.rung .tick{width:20px;text-align:center;color:var(--overlap);font-size:13px}
.fade{display:flex;justify-content:space-between;align-items:baseline;padding:7px 0;
  border-bottom:1px solid var(--rule);font-size:12px}
.fade.gone{opacity:.35;text-decoration:line-through}
.fade span{font-family:var(--mono);font-size:9px;color:var(--ink-3)}
.seal{border:2px dashed var(--rule);border-radius:14px;padding:18px;text-align:center;
  background:color-mix(in srgb,var(--dawn) 5%,transparent)}
.danger{border:1px solid var(--ban);border-radius:12px;padding:13px;
  background:color-mix(in srgb,var(--ban) 5%,#fff)}
.danger h5{margin:0 0 7px;font-family:var(--display);font-weight:600;font-size:15px;color:var(--ban)}


.panebox{position:relative;width:100%;aspect-ratio:0.75;border:1px solid var(--rule);
  border-radius:10px;background:linear-gradient(160deg,#F8F5EF,#EFF3F6);overflow:hidden}
.panebox .hz{position:absolute;left:60%;top:60%;width:35%;height:35%;
  border:1px dashed var(--dawn);border-radius:8px;
  background:color-mix(in srgb,var(--dawn) 9%,transparent);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:8px;color:var(--dawn);text-align:center;line-height:1.3}
.panebox .pn{position:absolute;background:linear-gradient(155deg,#2B3358,var(--night));
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  font-size:18px;box-shadow:0 2px 10px rgba(0,0,0,.22);transition:all .22s ease}


/* ---- real motion. Everything here is driven by a finger or a consequence of
   one; nothing moves on its own. ---- */
.mrail{position:relative;overflow:hidden;border:1px solid var(--rule);border-radius:12px;
  background:#FBFAF7;touch-action:pan-y}
.mtrack{display:flex;gap:10px;padding:12px;will-change:transform}
.mcard{flex:0 0 auto;width:120px;aspect-ratio:0.78;border-radius:12px;
  background:linear-gradient(155deg,var(--panel),#fff);border:1px solid var(--rule);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:26px;user-select:none}
.mcard b{font-family:var(--sans);font-size:10.5px;font-weight:600;margin-top:6px;
  color:var(--ink-2)}
.mscrob{position:relative;height:44px;border:1px solid var(--rule);border-radius:10px;
  background:#FBFAF7;touch-action:none;overflow:hidden}
.mscrob .fill{position:absolute;left:0;top:0;bottom:0;background:
  color-mix(in srgb,var(--dusk) 22%,transparent)}
.mscrob .knob{position:absolute;top:50%;width:26px;height:26px;margin-top:-13px;
  margin-left:-13px;border-radius:50%;background:var(--dusk);box-shadow:0 1px 4px rgba(0,0,0,.25)}
.mdial{position:relative;width:150px;height:150px;margin:0 auto;border-radius:50%;
  border:2px solid var(--rule);background:#FBFAF7;touch-action:none}
.mdial .hand{position:absolute;left:50%;top:50%;width:3px;height:58px;margin-left:-1.5px;
  margin-top:-58px;background:var(--dusk);border-radius:2px;transform-origin:50% 100%}
.mdial .val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-weight:700;font-size:30px;color:var(--dusk)}
.mstill{border:1px solid var(--rule);border-radius:10px;padding:12px;background:#fff}

/* ---- playable boards ---- */
.gwrap{padding:10px 12px}
.gtitle{font-family:var(--display);font-weight:600;font-size:16px;margin-bottom:2px}
.gsub{font-size:11.5px;color:var(--ink-2);margin-bottom:8px}
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.ttt b{aspect-ratio:1;border:1px solid var(--rule);border-radius:8px;display:flex;
  align-items:center;justify-content:center;font-size:24px;cursor:pointer;background:#fff}
.ttt b.x{color:var(--school)} .ttt b.o{color:var(--dawn)}
.ttt b.no{border-style:dashed;border-color:var(--ban);color:var(--ban);font-size:8px;
  font-family:var(--mono);cursor:not-allowed}
.ck{display:grid;grid-template-columns:repeat(8,1fr);gap:0;border:1px solid var(--rule);
  border-radius:6px;overflow:hidden}
.ck b{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:13px;
  cursor:pointer;background:#F0E4CE}
.ck b.d{background:#8B6F47}
.ck b.sel{outline:2px solid var(--overlap);outline-offset:-2px}
.ck b.can{background:#A8C8A0}
.ck i{width:72%;aspect-ratio:1;border-radius:50%;display:block;font-style:normal;
  display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
.ck i.A{background:#C8443E} .ck i.B{background:#22262E}
.bs{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}
.bs b{aspect-ratio:1;border-radius:3px;background:#DCE6F2;cursor:pointer;display:flex;
  align-items:center;justify-content:center;font-size:9px}
.bs b.hit{background:var(--ban);color:#fff} .bs b.miss{background:#B9C2D0;color:#fff}
.bs b.ship{background:#7C8698} .bs b.shipHit{background:var(--ban)}
.ws{display:grid;gap:1px;font-family:var(--mono);font-size:10px}
.ws b{aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;
  border-radius:2px;background:#fff}
.ws b.sel{background:var(--overlap);color:#fff}
.ws b.got{background:color-mix(in srgb,var(--overlap) 28%,#fff)}
.hm{display:flex;flex-wrap:wrap;gap:4px}
.hm b{width:26px;height:30px;border:1px solid var(--rule);border-radius:5px;display:flex;
  align-items:center;justify-content:center;font-size:12px;font-family:var(--mono);cursor:pointer;
  background:#fff}
.hm b.used{opacity:.3;cursor:not-allowed} .hm b.hit{background:color-mix(in srgb,var(--overlap) 25%,#fff)}
.mask{font-family:var(--mono);font-size:19px;letter-spacing:2px;text-align:center;margin:10px 0}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.mem b{aspect-ratio:1;border-radius:8px;background:var(--dusk);display:flex;align-items:center;
  justify-content:center;font-size:17px;cursor:pointer;color:#fff}
.mem b.up{background:#fff;border:1px solid var(--rule)}
.mem b.got{background:color-mix(in srgb,var(--overlap) 22%,#fff);border:1px solid var(--overlap)}
.ch{display:grid;grid-template-columns:repeat(8,1fr);border:1px solid var(--rule);
  border-radius:6px;overflow:hidden}
.ch b{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:15px;
  background:#F0E4CE;cursor:pointer}
.ch b.d{background:#8B6F47}
.db{position:relative;padding:8px}
.db .dot{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.db .ln{position:absolute;background:var(--rule);cursor:pointer;border-radius:2px}
.db .ln.A{background:var(--school)} .db .ln.B{background:var(--dawn)}
.db .bx{position:absolute;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700}
.gfoot{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.gfoot button{flex:1;min-width:78px;border:1px solid var(--rule);background:var(--surface);
  border-radius:8px;padding:8px;font-size:11.5px;color:var(--ink-2)}
.gnote{font-size:11px;color:var(--ink-3);margin-top:8px;line-height:1.5}
.gwin{background:color-mix(in srgb,var(--overlap) 12%,#fff);border-left:3px solid var(--overlap);
  padding:9px 11px;border-radius:6px;margin-top:9px;font-size:12.5px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
(function(){
"use strict";
var T = window.TL;
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var $ = function(id){ return document.getElementById(id); };

/** Every screen and panel runs inside this. A throw shows a readable card
 *  instead of a blank page, so exploring cannot break the demo. */
function guard(fn, where){
  try { return fn(); }
  catch(e){
    console.error(where, e);
    return '<div class="err">This section hit an error and was caught rather than '
      + 'breaking the page.<br><br><b>'+esc(where)+'</b><br>'+esc(e && e.message||e)+'</div>';
  }
}
function wip(key){
  var t = (T.UNDER_CONSTRUCTION||{})[key] || 'Not built yet.';
  return '<div class="wip"><div class="k">under construction</div><p>'+esc(t)+'</p></div>';
}
function real(label, obj){
  var body = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 1);
  return '<div class="real"><div class="k">'+esc(label)+'</div><pre>'+esc(body)+'</pre></div>';
}

// ---------------------------------------------------------------- screens --
var S = {};

S.childHome = function(){
  var c = T.clocks(), cal = T.calendar();
  var avail = c.reachable
    ? '<div class="pres"><div style="font-weight:600;font-size:13.5px">Dad is free right now</div>'
      + '<div style="font-size:11.5px;color:var(--ink-2)">It\'s '+esc(c.parentTime)+' where Dad is</div>'
      + '<button class="cta">Call Dad</button></div>'
    : '<div class="pres" style="background:var(--surface);border-color:var(--rule)">'
      + '<div style="font-weight:600;font-size:13.5px">Dad is busy right now</div>'
      + '<div style="font-size:11.5px;color:var(--ink-2)">He\'s free after '+esc(c.parentTime)+' his time</div></div>';
  var sleeps = cal.sleeps ? '<div class="sleeps"><div class="n">'+cal.sleeps.n+'</div>'
      + '<div style="font-size:12px;color:var(--ink-2)">'+(cal.sleeps.n===1?'sleep':'sleeps')
      + ' until<br><strong>'+esc(cal.sleeps.who)+"'s time</strong></div></div>" : '';
  return '<div class="pad"><div class="hdr" style="font-size:20px;margin:4px 0 0">Hi Maya</div></div>'
    + avail
    + '<div class="acts">'
    + '<button class="act" data-go="homework" style="background:linear-gradient(160deg,var(--school),#245A91)"><span class="ic">✎</span>Homework</button>'
    + '<button class="act" data-go="game" style="background:linear-gradient(160deg,var(--dusk),#6B4E90)"><span class="ic">◈</span>Play</button>'
    + '<button class="act" data-go="list" style="background:linear-gradient(160deg,var(--dawn),#C9832F)"><span class="ic">✦</span>My list</button>'
    + '<button class="act" data-go="inbox" style="background:linear-gradient(160deg,var(--overlap),#1F7A5F)"><span class="ic">✉</span>Messages</button>'
    + '</div>' + sleeps;
};

S.inbox = function(){
  var b = T.bedtimeDelivery();
  return '<div class="pad"><div class="hdr" style="font-size:18px;margin:4px 0 0">Messages</div></div>'
    + '<div class="blk ok" style="margin-top:12px"><div class="k">arriving tonight</div>'
    + '<p>A goodnight message from Dad will arrive at <strong>'+esc(b.at||'—')+'</strong>.</p></div>'
    + '<div class="row"><div class="g"><strong>Goodnight from Dad</strong><br>'
    + '<span class="t">watched yesterday, 8:34 PM</span></div><div class="chk on">✓</div></div>'
    + '<div class="row"><div class="g"><strong>Goodnight from Dad</strong><br>'
    + '<span class="t">watched Tuesday, 8:31 PM</span></div><div class="chk on">✓</div></div>'
    + '<div class="pad" style="padding-top:14px"><div style="font-size:11.5px;color:var(--ink-3)">'
    + 'Dad is somewhere with no signal right now. He left these for you.</div></div>';
};

S.homework = function(){
  var g = T.homeworkGate(window.__hwPreset || 'good');
  if (g.verdict.ok){
    var h = T.tutorHint(window.__hint || 'Ask what the bottom numbers have in common.', '2/3 + 1/5 = ___');
    return '<div class="pad" style="padding-top:6px">'
      + '<div style="font-family:var(--mono);font-size:10.5px;color:var(--ink-3)">Dad · 3:18 PM CDT · you · 4:18 PM EDT</div></div>'
      + '<div style="margin:10px 15px;padding:14px;background:#FBFAF7;border:1px solid var(--rule);border-radius:5px;font-family:var(--mono);font-size:11px;line-height:2.1">'
      + '3 &nbsp;2/3 + 1/5 = ______<br>4 &nbsp;3/8 + 1/2 = ______<br>5 &nbsp;5/6 − 1/4 = ______</div>'
      + (h.verdict.ok
        ? '<div class="blk" style="background:color-mix(in srgb,var(--school) 9%,var(--panel));border-left-color:var(--school)">'
          + '<div class="k" style="color:var(--school)">for Dad, not for Maya</div><p>'+esc(h.verdict.hint)+'</p></div>'
        : '<div class="blk"><div class="k">hint refused — '+esc(h.verdict.reason)+'</div>'
          + '<p>'+esc(h.verdict.safeFallback)+'</p></div>');
  }
  return '<div class="pad" style="padding-top:6px"></div>'
    + '<div style="margin:10px 15px;height:150px;background:#FBFAF7;border:1px solid var(--rule);border-radius:5px;filter:blur(3px);font-family:var(--mono);font-size:11px;padding:14px;line-height:2;color:#9AA6BA">3 &nbsp;2/3 + 1/5 = ______<br>4 &nbsp;3/8 + 1/2 = ______</div>'
    + '<div class="blk"><div class="k">let\'s try that again</div><p>'+esc(g.verdict.advice)+'</p></div>'
    + '<div class="pad"><button class="cta" data-hw="good">Take another photo</button></div>';
};

S.list = function(){
  var l = T.lists();
  var rows = function(kind){ return l.child.filter(function(i){return i.kind===kind;})
    .map(function(i){ return '<div class="row"><div class="chk'+(i.status==='handled'?' on':'')+'">'
      +(i.status==='handled'?'✓':'')+'</div><div class="g">'+esc(i.title)
      +'<br><span class="t">'+esc(i.status)+'</span></div></div>'; }).join(''); };
  return '<div class="seclbl" style="color:var(--ban)">needs</div>'+rows('need')
    + '<div class="seclbl">wants</div>'+rows('want')
    + '<div class="pad" style="padding-top:14px"><div style="font-size:11.5px;color:var(--ink-3);line-height:1.5">'
    + 'Wants have no prices and nothing to tap. They\'re for telling people about.</div></div>';
};

S.myday = function(){
  var st = T.strip();
  return '<div class="pad"><div class="hdr" style="font-size:18px;margin:4px 0 8px">My day</div></div>'
    + st.map(function(s){
      var style = s.current ? ' style="background:color-mix(in srgb,var(--school) 10%,transparent)"'
        : s.next ? ' style="border-left:3px solid var(--overlap)"' : '';
      return '<div class="row"'+style+'><div class="chk" style="border:none;'
        + 'display:flex;align-items:center;justify-content:center;font-size:14px">'
        + esc(s.icon)+'</div><div class="g">'
        + (s.current?'<strong>'+esc(s.label)+'</strong>':esc(s.label))
        + '<br><span class="t">'+esc(s.startsLocal)+(s.current?' — you are here':(s.next?' · next':''))+'</span></div></div>';
    }).join('');
};

S.weeks = function(){
  var cal = T.calendar();
  return '<div class="pad"><div class="hdr" style="font-size:18px;margin:4px 0 0">My weeks</div></div>'
    + (cal.sleeps ? '<div class="sleeps"><div class="n">'+cal.sleeps.n+'</div>'
      + '<div style="font-size:12px;color:var(--ink-2)">'+(cal.sleeps.n===1?'sleep':'sleeps')
      + ' until<br><strong>'+esc(cal.sleeps.who)+"'s time</strong></div></div>" : '')
    + '<div class="seclbl">next two weeks</div>'
    + cal.blocks.slice(0,7).map(function(b){
        return '<div class="row"><div class="g">'+esc(b.startLocalDate)
          + (b.endLocalDate!==b.startLocalDate?' → '+esc(b.endLocalDate):'')
          + '<br><span class="t">'+esc(b.label)+'</span></div></div>'; }).join('');
};

S.journal = function(){
  var r = T.journalAs('child');
  return '<div class="pad"><div class="hdr" style="font-size:18px;margin:4px 0 2px">Just mine</div>'
    + '<div style="font-size:12px;color:var(--ink-2)">Nobody else can read this. Not Mom, not Dad.</div></div>'

function gclose(v){
  if(!v || v.outcome===null || v.outcome===undefined) return '';
  var msg = v.outcome==='draw' ? 'A draw. Good game.'
    : v.outcome==='done' ? 'What a story.'
    : 'Good game.';
  return '<div class="gwin">'+msg+'</div>';
}

    var blocked = v.handicap==='no_centre' && i===4;
    return '<b class="'+(c==='A'?'x':c==='B'?'o':'')+(blocked&&!c?' no':'')+'" '
      + (c||blocked?'':'data-ttt="'+i+'"')+'>'
      + (c==='A'?'✕':c==='B'?'◯':blocked?'not for<br>Dad':'')+'</b>'; }).join('');
  return '<div class="gwrap"><div class="gtitle">Three in a row</div>'
    + '<div class="gsub">'+(v.banner ? esc(v.banner) : 'Tap a square. You are ✕.')+'</div>'
    + '<div class="ttt">'+cells+'</div>' + gclose(v)
    + gfoot('tictactoe','<button data-gh="tictactoe:no_centre">Handicap Dad</button>')
    + '<div class="gnote">Take back as often as you like. Dad replies after each move.</div></div>';
};

S.playCheckers = function(){
  var v = T.gView('checkers') || (T.gStart('checkers'), T.gView('checkers'));
  var sel = window.__ckSel;
  var canTo = {};
  if(sel) v.legal.filter(function(m){return m.from[0]===sel[0]&&m.from[1]===sel[1];})
    .forEach(function(m){ canTo[m.to[0]*8+m.to[1]]=1; });
  var out='';
  for(var r=0;r<8;r++) for(var c=0;c<8;c++){
    var dark=(r+c)%2===1, p=v.board[r][c], id=r*8+c;
    var cls='b'+(dark?' d':'')+(sel&&sel[0]===r&&sel[1]===c?' sel':'')+(canTo[id]?' can':'');
    out+='<b class="'+cls.slice(2)+'" data-ck="'+r+','+c+'">'
      +(p?'<i class="'+p.side+'">'+(p.king?'K':'')+'</i>':'')+'</b>';
  }
  return '<div class="gwrap"><div class="gtitle">Checkers</div>'
    + '<div class="gsub">You are red. Captures are compulsory'
    + (v.mustContinue?' — keep jumping!':'')+'.</div>'
    + '<div class="ck">'+out+'</div>' + gclose(v)
    + '<div class="gnote">Yours '+v.counts.A+' · Dad '+v.counts.B+'</div>'
    + gfoot('checkers') + '</div>';
};

S.playBattleship = function(){
  var v = T.gView('battleship') || (T.gStart('battleship'), T.gView('battleship'));
  var hit={}, miss={};
  v.myShots.forEach(function(c){ (v.theirHits.indexOf(c)>=0?hit:miss)[c]=1; });
  var theirs=''; for(var i=0;i<64;i++)
    theirs+='<b class="'+(hit[i]?'hit':miss[i]?'miss':'')+'" data-bs="'+i+'">'
      +(hit[i]?'✕':miss[i]?'·':'')+'</b>';
  var mine=''; var shipCells={};
  v.myShips.forEach(function(s){ s.cells.forEach(function(c){ shipCells[c]=s.hits.indexOf(c)>=0?2:1; }); });
  for(var j=0;j<64;j++)
    mine+='<b class="'+(shipCells[j]===2?'shipHit':shipCells[j]?'ship':(v.theirShots.indexOf(j)>=0?'miss':''))+'"></b>';
  return '<div class="gwrap"><div class="gtitle">Battleship</div>'
    + '<div class="gsub">Tap to fire. A hit means you go again.</div>'
    + '<div class="bs">'+theirs+'</div>'
    + (v.theirSunk.length? '<div class="gnote">Sunk: '+esc(v.theirSunk.join(', '))+'</div>':'')
    + '<div class="gnote" style="margin-top:9px">your fleet</div>'
    + '<div class="bs" style="margin-top:4px">'+mine+'</div>'

function calGrid(g, opts){
  opts = opts || {};
  var head = T.DOW_SHORT.map(function(d){ return '<div class="h">'+d.slice(0,1)+'</div>'; }).join('');
  var cells = g.cells.map(function(c){
    if(c.day===null) return '<b class="blank"></b>';
    var cls = (opts.selected===c.day?' on':'') + (c.markers.length?' bday':'')
      + (c.isToday?' today':'');
    return '<b class="'+cls.trim()+'"'+(opts.tap?' data-bdd="'+c.day+'"':'')
      + (c.markers.length&&opts.markerHex?' style="--marker:'+opts.markerHex+'"':'')
      + '>'+c.day+'</b>'; }).join('');
  return '<div class="cgrid">'+head+cells+'</div>';
}

S.__motionWire = function(){
  var d = document;
  var track = d.getElementById('mtrack'), rail = d.getElementById('mrail');
  if(track && !track.__wired){
    track.__wired = 1;
    var x=0, sx=0, ox=0, dragging=false, vel=0, last=0, lastT=0;
    var maxScroll = function(){ return Math.max(0, track.scrollWidth - rail.clientWidth); };
    var apply = function(px){ track.style.transform='translateX('+px+'px)'; };
    var band = function(px){
      var m = maxScroll();
      if(px > 0) return T.Motion.rubberBand(px, 400);
      if(px < -m) return -m + T.Motion.rubberBand(px + m, 400);
      return px;
    };
    var down=function(e){ dragging=true; sx=(e.touches?e.touches[0].clientX:e.clientX);
      ox=x; vel=0; last=sx; lastT=Date.now(); track.style.transition='none'; };
    var move=function(e){ if(!dragging) return;
      var cx=(e.touches?e.touches[0].clientX:e.clientX);
      var now=Date.now(); if(now>lastT){ vel=(cx-last)/(now-lastT); last=cx; lastT=now; }
      x = band(ox + (cx-sx)); apply(x); if(e.cancelable) e.preventDefault(); };
    var up=function(){ if(!dragging) return; dragging=false;
      var reduced = T.motionView().reduced;
      var throwPx = reduced ? 0 : Math.sign(vel) * T.Motion.flingDistance(Math.abs(vel));
      var target = Math.max(-maxScroll(), Math.min(0, x + throwPx));
      track.style.transition='transform '+(reduced?90:420)+'ms cubic-bezier(.16,1,.3,1)';
      x = target; apply(x); };
    rail.addEventListener('pointerdown',down); rail.addEventListener('touchstart',down,{passive:true});
    d.addEventListener('pointermove',move); d.addEventListener('touchmove',move,{passive:false});
    d.addEventListener('pointerup',up); d.addEventListener('touchend',up);
  }

  var sc = d.getElementById('mscrob');
  if(sc && !sc.__wired){
    sc.__wired = 1;
    var set=function(e){
      var r=sc.getBoundingClientRect();
      var cx=(e.touches?e.touches[0].clientX:e.clientX);
      var p=Math.max(0,Math.min(1,(cx-r.left)/r.width));
      d.getElementById('mfill').style.width=(p*100)+'%';
      d.getElementById('mknob').style.left=(p*100)+'%';
      d.getElementById('mscroblbl').textContent='line '+(Math.round(p*11)+1)+' of 12';
      if(e.cancelable) e.preventDefault();
    };
    var on=false;
    sc.addEventListener('pointerdown',function(e){on=true;set(e);});
    sc.addEventListener('touchstart',function(e){on=true;set(e);},{passive:false});
    d.addEventListener('pointermove',function(e){if(on)set(e);});
    d.addEventListener('touchmove',function(e){if(on)set(e);},{passive:false});
    d.addEventListener('pointerup',function(){on=false;});
    d.addEventListener('touchend',function(){on=false;});
  }

  var dial = d.getElementById('mdial');
  if(dial && !dial.__wired){
    dial.__wired = 1;
    var setD=function(e){
      var r=dial.getBoundingClientRect();
      var cx=(e.touches?e.touches[0].clientX:e.clientX);
      var cy=(e.touches?e.touches[0].clientY:e.clientY);
      var a=Math.atan2(cy-(r.top+r.height/2), cx-(r.left+r.width/2))*180/Math.PI+90;
      if(a<0) a+=360;
      var n=2+Math.round((a/360)*15);
      d.getElementById('mhand').style.transform='rotate('+a+'deg)';
      d.getElementById('mval').textContent=n;
      if(e.cancelable) e.preventDefault();
    };
    var onD=false;
    dial.addEventListener('pointerdown',function(e){onD=true;setD(e);});
    dial.addEventListener('touchstart',function(e){onD=true;setD(e);},{passive:false});
    d.addEventListener('pointermove',function(e){if(onD)setD(e);});
    d.addEventListener('touchmove',function(e){if(onD)setD(e);},{passive:false});
    d.addEventListener('pointerup',function(){onD=false;});
    d.addEventListener('touchend',function(){onD=false;});
  }
};

spotdiff: function(){ var v=T.spotView();

library: function(){ var v=T.libView();

thebook: function(){ var r=T.libBook();

storyteller: function(){ var v=T.stView();
  return P_engine('The storyteller',
  '<p>Built for a five-year-old who likes being read to, and a parent who likes '

  + real('auditStory() — safe for five, checked on OUTPUT', v.audit)
  + '<p style="margin-top:12px"><strong>§9.11.4 is the guard that matters most '

  + 'given evening. So the storyteller does not go near it — <code>divorce</code>, '
  + '<code>two houses</code>, <code>custody</code> and <code>Mummy and Daddy</code> '

birthday: function(){ var v=T.bdView();
  return P_engine('She places her own birthday',
  '<p>A six-year-old finding a date six years in the past is genuinely hard: '

ladder: function(){ var v=T.ladderView();
  return P_engine('The ladder, built',
  '<p>§21 said the handover at eighteen should be the last of many transitions, '
  + 'not the only one. It was specified in v0.21.0 and deliberately not built. '
  + 'This is item 1 of its own sequencing: <strong>an append-only grant '
  + 'record</strong>.</p>'
  + '<p>There is <code>recordGrants()</code> and there is no <code>revoke()</code>. '
  + 'The absence is the mechanism — the same construction as P7 and P8. Jump the '

  + '<p><strong>§21.9 A, settled:</strong> ages move <em>later</em> only, and only '
  + 'by both guardians. Moving one earlier is the obvious lever for a controlling '

quieting: function(){ var v=T.quietView();
  return P_engine('The quieting',
  '<p>Most products add features as users age and measure success in engagement. '
  + '<strong>This one withdraws.</strong> At five the app is scaffolding; at '
  + 'seventeen a girl texting her father does not need a send-time guard, and '
  + 'offering her one is faintly insulting.</p>'
  + '<p><strong>The asymmetry is the whole thing.</strong> The send-time guard '
  + 'fades on her side at fourteen and <em>never fades on his</em>. A parent '
  + 'messaging a sleeping child at 2am is a different act from a teenager messaging '
  + 'a parent at 2am — the guard exists to protect her sleep, not to teach her '
  + 'manners.</p>'
  + real('at ' + v.age, v.surfaces)
  + real('send guard', {her: v.guardHer, him: v.guardHim})); },

letters: function(){ var v=T.letterView();
  return P_engine('Letters to her future self',
  '<p>Sealed at nine, opened at eighteen. <code>preserved</code> is a literal '
  + '<code>true</code>: a letter on a 90-day clock is a lost letter, and there is '
  + 'no configuration in which that would be acceptable.</p>'
  + '<p><strong>Nobody can open it early — including her.</strong> That second half '
  + 'is the interesting one. A sealed letter she can peek at is not sealed, and the '
  + 'value of the mechanic is that nine-year-old-her gets to say something '
  + 'eighteen-year-old-her cannot pre-edit.</p>'
  + '<p>She <em>can</em> delete it, because it is hers (§2.10). Delete-without-read '

childbank: function(){ var v=T.bankView();
  return P_engine('She banks for him',
  '<p>Everything in §9 was done <em>to</em> her or <em>for</em> her. This reverses '

availability: function(){ var v=T.availView();
  return P_engine('Rung 15 — the inversion',

  + 'adults coordinating <em>around</em> a child, her day-parts inferred from '

  + '<p>At fifteen she publishes, and the ribbon shows what she set. The inference '

deletion: function(){ var v=T.deletionView();
  return P_engine('Rung 18 — the hardest button',
  '<p>§21.7 called this the hardest button anyone builds here, and it is. An '
  + 'eighteen-year-old who says "delete all of it" must be able to, immediately and '
  + 'completely. <strong>If that is not real, §2.10 is decoration.</strong></p>'
  + '<p><strong>No cooling-off period.</strong> <code>COOLING_OFF_HOURS = 0</code>, '
  + 'and there is no <code>executeAfter</code> field to set. A delay is a soft '

siblings: function(){ var v=T.siblingView();
  return P_engine('Siblings, staggered',

  + '<p><strong>Guardianship closes per child, never per family.</strong> A parent '
  + 'whose eldest turns eighteen has not stopped being a parent, and a shell that '

  + 'cruel.</p>'
  + '<p>The notice is shown once, on the day, and never again. It is not an '

  + real('notice', v.notice || 'nobody has aged out yet')

teachme: function(){ var v=T.teachView();
  return P_engine('Teach me something',
  '<p>Every educational feature so far treats learning as something she does and '
  + 'he supervises. Homework help has an expertise gradient, and §9.1 had to invent '

  + '<p><strong>This inverts it.</strong> He knows how to do things, and teaching is '

observers: function(){ var v=T.observerView();
  return P_engine('The observer tier',
  '<p>A grandparent, a therapist, a parenting coordinator. Read-only, '
  + 'scope-limited, and — the part that matters — <strong>time-boxed by '

access: function(){ var v=T.a11yView();
  return P_engine('Accessibility',
  '<p>Named across three increments — a deaf parent, a noisy room, a child with '
  + 'dyslexia — and never built until now.</p>'
  + '<p><strong>The finding that shaped it: live captions imply transcription, and '
  + 'a transcript of a child\'s call is exactly the artifact the §13 court-export '
  + 'tension is about.</strong> A caption stream that left the device, or '
  + 'persisted, would create a searchable record of every conversation a child has '
  + 'ever had with a parent — and it would do it while wearing an accessibility '
  + 'badge. So captions are on-device and non-persisted, and that is not a '
  + 'setting.</p>'
  + '<p>The second finding is a layout one. At 1.5× on the Fold\'s 673 px main '
  + 'screen the <em>effective</em> width is 449 px, so two columns must collapse to '
  + 'one. Computing the breakpoint from device width rather than scaled width is '
  + 'the mistake that makes accessible layouts break on small screens — try the '
  + 'scale buttons on the cover screen.</p>'
  + real('caption policy', v.policy)
  + real('auditCaptions() on a persisted stream', v.badPolicy)
  + real('layout at this scale',
      {device:v.device.w, effective:v.effectiveWidth, columns:v.columns,
       target:v.target, floor:v.minTarget})
  + real('a11yAudit()', v.audit)); },







signal: function(){ var v=T.signalView();
  return P_engine('The come-back signal',
  '<p><strong>He requests. She acts.</strong> No data flows back, no control '
  + 'channel exists, and the child performs every action herself. That single '
  + 'constraint is what lets this expand to sixteen applications safely — each '
  + 'inherits the same safety rather than needing its own argument.</p>'
  + '<p>It exists because the alternative was remote control of a child\'s device, '
  + 'which is a stalkerware primitive however kindly it is framed. <strong>P11</strong> '
  + 'now forbids that outright, <em>including for the child\'s benefit</em> — the '
  + 'benign framing is exactly how it would be reintroduced in two years.</p>'
  + '<p><strong>Settled: no third adults.</strong> A grandparent or stepparent in '
  + 'the room can simply speak. <strong>Settled: the ignored signal is invisible</strong> '
  + '— no count, no badge, no "she has not responded". If he needs to know she is '
  + 'alright, that is a phone call to the other adult, not an inference drawn from '
  + 'a child\'s non-tap.</p>'
  + '<p>Priority: safety first, then <strong>absence beats presence</strong> — the '
  + 'parent she is with can simply talk to her. Then in-call, then simply first. '
  + '<strong>Under no circumstances does the order of a court order become the '
  + 'order of a prompt on a child\'s screen.</strong></p>'
  + real('priority resolution', v.priority)
  + real('a leaky sender view is caught', v.senderAuditBad)
  + real('ceilings', v.ceilings)
  + real('the escape hatch — why "come back" is usually unnecessary', v.hatch)); },

a11ymatrix: function(){ var v=T.signalView().matrix;
  return P_engine('The accessibility matrix',
  '<p>Built to be <strong>extended and rolled out incrementally</strong> rather '
  + 'than shipped complete. Each form carries a readiness state — shipped, '
  + 'scaffolded, specified, considered — so a form can be specified long before it '
  + 'is built and the build can tell the difference.</p>'
  + '<p>That is the F-series lesson applied to accessibility: <strong>promoting a '
  + 'form to "shipped" with an unmet requirement is refused</strong>, and readiness '
  + 'only ever moves forward.</p>'
  + '<p><strong>The rule that shapes it:</strong> the signal is the product\'s only '
  + 'interruption pattern, so it cannot be sight-gated or hearing-gated. Every '
  + 'signal must be perceivable through at least two independent channels — and the '
  + '<em>baseline alone</em> satisfies that, before any option is enabled.</p>'
  + '<p>The matrix is data. A form can be added at any time without touching a '
  + 'single consumer, because every consumer reads it rather than hard-coding a '
  + 'list.</p>'
  + real('baseline covers', v.channels)
  + real('text alone is not perceivable', v.textAlone)
  + real('shipping haptic with no vibrator', v.promoteRefused)
  + real('with one, it is allowed', v.promoteOk)
  + real('rollout', v.rollout)); },



budget: function(){ var v=T.budgetView(), st=T.streamView();
  return P_engine('Stream stability, and the capability budget',
  '<p><strong>The device matrix declared three tiers and exactly one thing '
  + 'consumed them — the call.</strong> Games, colouring, the gallery, the '
  + 'storyteller and the pane each assumed independently what the hardware could '
  + 'do, and none of them checked. A 2 GB tablet running the pane, a checkers board '
  + 'and a waveform had three claims that were each individually reasonable, and '
  + 'nothing computed the total.</p>'
  + '<p><strong>The budget is binding, not advisory.</strong> An advisory budget is '
  + 'the same class of thing as a declaration with nothing behind it, which the '
  + 'F-series exists to catch.</p>'
  + '<p>The order is: ambient motion, then video quality by substitution, then the '
  + 'pane to a still frame, then concurrent activity, then video entirely. '
  + '<strong>The voice is never a candidate</strong> — it is not merely sorted '
  + 'last, the loop refuses to consider it.</p>'
  + '<p><strong>The stream ladder sits UNDER the rung ladder</strong>, so three '
  + 'video qualities are tried before the picture goes at all. And it is '
  + 'deliberately asymmetric: two seconds to shed, twelve to restore. A connection '
  + 'good for three seconds is not a good connection, and a picture that keeps '
  + 'appearing and vanishing is worse than none — she looks up expecting her father '
  + 'and gets a grey rectangle, and she will stop looking up.</p>'
  + real('the voice survives every scenario, on every tier', v.audioAlways)
  + real('what this tier did', v.resolution.trace)
  + real('admitting discloses what it cost', v.admitTight)
  + real('drop:restore asymmetry', '1:'+st.ratio)
  + real('and there is no connection meter', st.meter)); },

motion: function(){ var v=T.motionView();
  return P_engine('Motion',
  '<p>Everything on her side was static. A five-year-old reads a static interface '
  + 'as a <em>picture</em> of an app: things do not appear touchable, and when they '
  + 'change they simply cut, which teaches her nothing about where anything went.</p>'
  + '<p><strong>Motion follows the finger. It never leads it.</strong> Every '
  + 'animation is either driven 1:1 by her gesture or a consequence of something she '
  + 'just did. <strong>Nothing moves on its own to attract her</strong> — and that '
  + 'one rule is the difference between an interface that feels alive and a slot '
  + 'machine, which is what children\'s software usually becomes.</p>'
  + '<p>The rail, the scrobbler and the dial on the left are real. Drag them.</p>'
  + '<p><strong>Where motion is a bad idea, it stops.</strong> Bedtime, homework, '
  + 'the journal and the emergency card are <em>still</em>. But still means a '
  + 'crossfade rather than a cut — a hard cut is disorienting in its own way.</p>'
  + '<p>A dial rather than a slider because <strong>a dial has a centre to orbit and '
  + 'a slider has a line to stay on</strong>, and a small hand wanders off a line. '
  + 'And no gesture is ever the only route: tap always suffices.</p>'
  + real('autonomous motion is refused',
      v.admits.filter(function(a){return a.kind==="autonomous";})[0].verdict)
  + real('ambient only where the movement IS the information',
      v.admits.filter(function(a){return a.kind==="ambient";}).map(function(a){
        return a.surface+": "+(a.verdict.ok?"allowed":"refused"); }))
  + real('celebration once is delight, every time is a schedule', v.celebrate[1])
  + real('quiet surfaces at this setting', v.effective)); },

pane: function(){ var v=T.paneView();
  return P_engine('The pane',
  '<p><strong>The core move is not to use the OS at all.</strong> Android Go '
  + 'disables platform PiP outright, FireOS reports Android 9 and may still refuse '
  + 'it, and <em>screen pinning blocks the API by design</em> — the kiosk that keeps '
  + 'her in the app is the same mechanism that forbids the feature.</p>'
  + '<p>So this is a positioned view inside our own hierarchy. No platform API, no '
  + 'firmware dependency, no permission, no kiosk conflict. It renders identically '
  + 'on a £50 Fire tablet and a Fold, because it is a box we draw.</p>'
  + '<p><strong>She cannot close it.</strong> A child who accidentally loses her '
  + 'father\'s face and cannot work out how to get it back has lost the call — and '
  + 'she will not say so, she will just go quiet. Only ending the call ends it.</p>'
  + '<p><strong>The pane yields; she never has to.</strong> An active surface '
  + 'declares where her hands are and the pane relocates to the corner furthest '
  + 'from every hot zone — not merely the nearest one.</p>'
  + '<p><strong>Audio is decoupled entirely.</strong> If the pane fails, is '
  + 'occluded, or the renderer dies, the voice never drops. On this hardware a '
  + 'renderer falling over is a Tuesday, and a child who can still hear her father '
  + 'has not lost anything that matters.</p>'
  + '<p><strong>The probe attempts and verifies — it never asks.</strong> '
  + '<code>SDK_INT >= 26</code> is a lie on FireOS. The probe tries, confirms the '
  + 'mode was actually entered, and falls back silently. Nothing depends on the '
  + 'answer.</p>'
  + real('a platform that claims support and does not deliver',
      v.probes[1])
  + real('a child cannot close it', v.childClose)
  + real('audio survives the pane', {paneVisible:v.failed.pane.visible,

callfns: function(){ var v=T.callView();
  return P_engine('The call, properly',
  '<p><strong>Audio-only is a choice, not a punishment.</strong> A self-conscious '
  + 'eleven-year-old, a bad hair day, a child who does not want to be seen today. '
  + 'He is told the call is voice-only; <strong>he is never told why</strong> — '
  + '"she chose not to be seen" is a fact a parent will overinterpret, and the '
  + 'overinterpretation lands on her.</p>'
  + '<p><strong>The rear camera is the highest-value item here.</strong> "Show me" '
  + 'during a call is turning the phone around — and flipping to it turns mirroring '
  + 'OFF, because a mirrored rear camera renders every word she holds up backwards. '
  + 'That one line makes the homework case work.</p>'
  + '<p><strong>P10 is new and permanent: no appearance modification on a child\'s '
  + 'video.</strong> No beauty filters, no smoothing, no slimming — not as a '
  + 'default, not as an option, not as a sticker that happens to reshape a face. It '
  + 'teaches a five-year-old that the version of her face the software prefers is '
  + 'better than the one her father sees, during the one activity that exists so he '
  + 'can see her. Dog ears are fine.</p>'
  + '<p><strong>PiP conflicts with the lock.</strong> PiP exists so a call survives '
  + 'you leaving the app; a child in kiosk mode cannot leave the app. So it is '
  + 'guardian-only — and what the product has been calling "picture in picture" in '
  + 'game layouts is a <em>layout</em>, which is a weaker claim than the name.</p>'
  + real('what he sees when she goes voice-only', v.forOther)
  + real('flipping turns mirroring off', {facing:v.camera.facing, mirrored:v.camera.mirrored})
  + real('P10', v.effects)
  + real('PiP on a locked child device', v.pip.lockedChild)
  + real('nothing on a child screen says "failed"',
      v.trouble.map(function(t){return t.state+': '+t.line;}))); },

theten: function(){ var v=T.tenView();
  return P_engine('Ten, derived from the audit',
  '<p>The audit ran first, per the rule. It found <strong>three things declared '
  + 'last increment and never built</strong>: a <code>degradesTo</code> target that '
  + 'existed only as a string, a <code>fold_tabletop</code> posture with no layout, '
  + 'and a FireOS fallback route described in the device matrix and absent from the '
  + 'transport.</p>'
  + '<p>That is a worse state than an omission. An omission is visible; a documented '
  + 'assurance with nothing behind it reads as done, and every check passed because '
  + 'they verified the declaration was well-formed rather than that anything '
  + 'answered it.</p>'
  + '<p><strong>The F-series now catches exactly that</strong> — every '
  + '<code>degradesTo</code> target must resolve, every landscape-capable posture '
  + 'must have an arrangement, and every declared fallback must have a matching '
  + 'route. Both new checks were shown to fail when their guard was removed.</p>'
  + '<p>Two things worth reading below. <strong>The sender is told the truth</strong> '
  + '— the original defect was not that FCM was missing, it was that both people '
  + 'were misled and neither could discover it, and a fallback that fails quietly '
  + 'reproduces that with more machinery. And <strong>the youngest sibling goes '
  + 'first</strong>: by the time a thirteen-year-old has been on for ten minutes, a '
  + 'five-year-old has left the room.</p>'
  + real('unreachable is never reported as delivered',
      v.routes[3].status)
  + real('at the ping limit she cannot tell which branch she got',
      {within:v.atLimit.within.line, atLimit:v.atLimit.at.line})
  + real('but HE is told, because he needs it', v.atLimit.guardian)); },

devices: function(){ var v=T.deviceView();
  return P_engine('The device matrix',
  '<p>Everything had been designed against two viewports — a Fold folded and '
  + 'unfolded — and everything else assumed. Nine postures are now declared, and '
  + 'the layout audit runs against all of them.</p>'
  + '<p><strong>The finding that matters most is the silent device.</strong> A '
  + 'great many separated families hand a child a £50 Amazon Fire tablet. FireOS '
  + 'has no Play Services, therefore no FCM — and with the transport as it stood, a '
  + 'notification would be built, dispatched, and discarded. <em>She never learns '
  + 'he wrote. He never learns she was not told.</em> Both people misled at once, '
  + 'neither able to discover it.</p>'
  + '<p>A channel that can neither push nor fall back is now <strong>refused</strong>, '
  + 'not warned about.</p>'
  + '<p><strong>Second: the half-open Fold.</strong> It stands by itself with the '
  + 'camera at eye level — the only hands-free call posture the hardware has, and '
  + 'the difference between a child holding a phone for eleven minutes and playing '
  + 'on the floor while her father watches. Nothing used it.</p>'
  + '<p><strong>Third: tablets live in landscape</strong>, the opposite of phones, '
  + 'and a portrait-only surface now fails the audit on any landscape-only posture.</p>'
  + real('this viewport', {posture:v.posture, columns:v.columns,
      inputs:v.inputs, stylusRequired:v.stylusRequired})
  + real('a Fire tablet is admitted, with its fallback', v.fireAdmit)
  + real('and the guardian is told, without blaming anyone', v.fireAdvice)
  + real('iOS Guided Access cannot be enabled remotely',
      v.locks.filter(function(l){return l.channel==="ios";})[0])

ninemore: function(){ var v=T.nineView();

  return P_engine('Nine more engines',
  '<p>Accessibility, the emergency card, a global child-payload sweep, language, '

engineroom: function(){ var r=T.engineRoom();

  return P_engine('Engine room',
  '<p>Every shipped engine, called live in this page. The values on the left were '

  + '<p>Before this screen existed, <strong>21 of the 37 built modules had no demo '
  + 'surface at all</strong>. Screens like the homework capture, the journal and the '

  + 'called. That gap is the kind that grows quietly.</p>'
  + '<p>Seventeen of the twenty-one bundle for a browser and are wired above. The '
  + 'other four import <code>node:http</code> or <code>node:crypto</code> and cannot '
  + '— by construction, not by neglect. They are <strong>declared</strong> in the '
  + 'demo manifest with the dependency named.</p>'
  + '<p><strong>And it is now enforced.</strong> The E-series checks in '
  + '<code>check-markup.mjs</code> fail the build if any module in the build script '
  + 'is neither imported by the demo bridge nor listed as node-only with a reason. '
  + 'Silence is no longer a possible state.</p>'
  + real('live probes', {passing: probes, failing: fails, engines: r.length})
  + real('portable SHA-256, computed in this page',
      r.filter(function(e){return e.id==='ledger';})[0].data.probes[0].value)
  + real('node-only, declared', T.NODE_ONLY)); },

asks: function(){ var v=T.askView();

hisworld: function(){ var v=T.askView();

gallery: function(){ var v=T.galleryView(window.__galViewer||'child');
  return P_engine('The gallery',

briefing: function(){ var v=T.briefView();
  return P_engine('The pre-call briefing',
  '<p>Probably the highest-value screen in the product, because it decides whether '
  + 'the call that follows is any good.</p>'

  + 'opens none of them and opens with “how was school”, and she says “fine”, and '

carenote: function(){ var v=T.careView();

catchup: function(){ var v=T.catchView();

inbox: function(){ var v=T.inboxView();

closing: function(){ var v=T.closeView();

reading: function(){ var v=T.readView();

handoff: function(){ var r=window.__handoff||T.handoffTry('child');

busy: function(){ var v=T.busyView(window.__busy||'school');

palette: function(){ var v=T.palView();

paletteParent: function(){ var v=T.palView();

welcome: function(){ var v=T.entryView(), p=T.entryProof();

onboarding: function(){ var v=T.obView();

playShowcase: function(){ return P_engine('The showcase matrix',

/**
 * The frame is drawn at the TRUE aspect ratio of whichever Z Fold 5 screen is
 * selected, scaled down to fit the page. Showing a generic tall rectangle for a
 * nearly-square 673x841 main screen would misrepresent every layout decision
 * made against it.
 */
function applyDevice(){
  var d = DEV[devMode]; if(!d) return;
  window.__devObj = d;
  var css = d.css, box = document.querySelector('.phone');
  if(!box) return;
  var avail = Math.min(window.innerWidth - 40, 420);
  var scale = Math.min(1, avail / css.w, 660 / css.h);
  box.style.width  = Math.round(css.w * scale) + 'px';
  box.style.height = Math.round(css.h * scale) + 'px';
  // The main screen is wide enough that a phone-sized radius looks wrong on it.
  box.style.borderRadius = (devMode === 'main' ? 20 : 30) + 'px';
  box.classList.toggle('unfolded', devMode === 'main');
  $('devnote').textContent = d.label + ' · ' + css.w + '×' + css.h +
    ' CSS · ' + d.physical + ' physical';
  $('d-cover').classList.toggle('on', devMode === 'cover');
  $('d-main').classList.toggle('on', devMode === 'main');
}
$('d-cover').onclick = function(){ devMode='cover'; applyDevice(); render(); };
$('d-main').onclick  = function(){ devMode='main';  applyDevice(); render(); };

/**
 * Unfolding resizes the viewport LIVE. Anything that measured a width once at
 * load would be wrong from the moment the hinge opens, so the layout is
 * recomputed on resize rather than cached.
 */
window.addEventListener('resize', function(){ try{ applyDevice(); }catch(e){ console.error(e); } });

var DEV = {}, devMode = 'cover';
(function(){ try{
  var man = JSON.parse(document.getElementById('tl-manifest').textContent);
  $('demover').textContent = man.version;
  DEV = JSON.parse(document.getElementById('tl-device').textContent);
}catch(e){ console.error('manifest', e); } })();

/**
 * The frame is drawn at the TRUE aspect ratio of whichever Z Fold 5 screen is
 * selected, scaled down to fit the page. Showing a generic tall rectangle for a
 * nearly-square 673x841 main screen would misrepresent every layout decision
 * made against it.
 */
function applyDevice(){
  var d = DEV[devMode]; if(!d) return;
  window.__devObj = d;
  var css = d.css, box = document.querySelector('.phone');
  if(!box) return;
  var avail = Math.min(window.innerWidth - 40, 420);
  var scale = Math.min(1, avail / css.w, 660 / css.h);
  box.style.width  = Math.round(css.w * scale) + 'px';
  box.style.height = Math.round(css.h * scale) + 'px';
  // The main screen is wide enough that a phone-sized radius looks wrong on it.
  box.style.borderRadius = (devMode === 'main' ? 20 : 30) + 'px';
  box.classList.toggle('unfolded', devMode === 'main');
  $('devnote').textContent = d.label + ' · ' + css.w + '×' + css.h +
    ' CSS · ' + d.physical + ' physical';
  $('d-cover').classList.toggle('on', devMode === 'cover');
  $('d-main').classList.toggle('on', devMode === 'main');
}
$('d-cover').onclick = function(){ devMode='cover'; applyDevice(); render(); };
$('d-main').onclick  = function(){ devMode='main';  applyDevice(); render(); };

/**
 * Unfolding resizes the viewport LIVE. Anything that measured a width once at
 * load would be wrong from the moment the hinge opens, so the layout is
 * recomputed on resize rather than cached.
 */
window.addEventListener('resize', function(){ try{ applyDevice(); }catch(e){ console.error(e); } });

$('guided-bar').hidden=false; $('nav').hidden=true;
applyDevice();
render();
setInterval(function(){ try{ render(); }catch(e){ console.error(e); } }, 30000);
})();
