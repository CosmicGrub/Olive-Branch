name: olive_client
description: Olive Branch client — child and guardian shells.
publish_to: none
version: 0.15.0

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  jitsi_meet_flutter_sdk: ^13.1.0
  http: ^1.2.2
  # Real homework-photo capture (§9.1, §20.2b) -- capture_gate.dart's real
  # path. Federated across android/ios/linux/macos/web/windows
  # (image_picker_* endorsed implementations) -- confirmed against pub.dev's
  # own package metadata for this version, not assumed. No physical device
  # or emulator attached in this session to actually drive
  # ImageSource.camera end to end; `flutter analyze`/`flutter test` below
  # exercise everything except the literal on-device shutter press. Also used
  # by receipt_screen.dart's "Send one back" — real camera video capture
  # (pickVideo, source camera). See that file's own header for what "real"
  # covers and what it honestly doesn't (no object storage backend exists in
  # this repo yet, so the recorded file is never actually uploaded anywhere).
  image_picker: ^1.2.3
  # deletion_screen.dart's raw-export button (§16.1 #3, §2.11) writes the
  # downloaded bundle to the app's real documents directory.
  path_provider: ^2.1.4
  # MASTERFILE §11 — push transport, client side. Standard, well-supported
  # cross-platform Flutter plugins for FCM/APNs. This is real: the package
  # compiles, push_channel.dart's logic against it is real, and the request/
  # response shapes it produces are exactly what a real device would send.
  #
  # What it CANNOT do in this environment: `Firebase.initializeApp()` needs
  # a real Firebase project's native config -- android/app/google-services.json
  # (read by the Google Services Gradle plugin, not present in this repo) and,
  # were this client's ios/ platform folder to exist, GoogleService-Info.plist.
  # Neither is fabricated here — a placeholder file with fake project
  # credentials would look configured and fail confusingly deep inside the
  # Firebase Android SDK at first real run; no config file at all fails
  # loudly and immediately at Firebase.initializeApp(), which is the honest
  # failure mode. See push_channel.dart's own header for the runtime error
  # this actually produces, and MASTERFILE §11 / CHANGELOG for the same
  # caveat stated at the server side (fcm.ts/apns.ts's own missing-credential
  # errors).
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  # §8.8.5 — on-device read-aloud (tts_channel.dart). Federated across
  # android/ios/linux/macos/web/windows, same posture as image_picker above.
  # No cloud TTS API is ever called — see a11y.ts's own
  # READ_ALOUD_ON_DEVICE_ONLY/READ_ALOUD_NEVER_LOGGED, which this package's
  # real usage in tts_channel.dart is built to honor: flutter_tts wraps each
  # platform's native, offline speech synthesizer (AVSpeechSynthesizer,
  # android.speech.tts.TextToSpeech, ...), never a network call.
  flutter_tts: ^4.2.0

# See third_party/PATCH.md. Compile-time-only fix for a hardcoded
# compileSdkVersion 34 in the published package's own android/build.gradle,
# which conflicts with its own transitive androidx.media3:1.8.0 dependency
# (media3 requires compileSdk >= 35). Remove once upstream ships a fix.
dependency_overrides:
  jitsi_meet_flutter_sdk:
    path: third_party/jitsi_meet_flutter_sdk_patched

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
