name: olive_client
description: Olive Branch client — child and guardian shells.
publish_to: none
version: 0.15.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  jitsi_meet_flutter_sdk: ^13.1.0
  http: ^1.2.2

# See third_party/PATCH.md. Compile-time-only fix for a hardcoded
# compileSdkVersion 34 in the published package's own android/build.gradle,
# which conflicts with its own transitive androidx.media3:1.8.0 dependency
# (media3 requires compileSdk >= 35). Remove once upstream ships a fix.
dependency_overrides:
  jitsi_meet_flutter_sdk:
    path: third_party/jitsi_meet_flutter_sdk_patched

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
