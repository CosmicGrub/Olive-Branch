org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental-compile cache tries to compute a path relative between
# the project root and each dependency's source (e.g. the pub cache) --
# `RelocatableFileToPathConverter.toPath()` throws IllegalArgumentException
# ("this and base files have different roots") when the two live on
# different Windows drive letters (this checkout is on Z:\, the pub cache on
# C:\), a real, reproducible local-dev build failure, not a flake. Disabling
# incremental compilation avoids the codepath entirely; CI (Linux, one
# filesystem root) was never affected either way.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
