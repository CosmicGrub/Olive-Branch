# Strict. This project's whole record says an unchecked assumption becomes a
# defect, so the analyzer is configured to refuse rather than warn.
include: package:flutter_lints/flutter.yaml

analyzer:
  # third_party/jitsi_meet_flutter_sdk_patched/ (and its analyzer exclude) was
  # removed by the on-device performance pass: nothing in pubspec.yaml or the
  # Gradle build referenced it since the LiveKit migration. It remains in git
  # history (the commit before this one) if the kiosk-lock verification under
  # MANUAL_VERIFY_call_lock_task.md ever needs the Kotlin it carried.
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error
    todo: warning
    unused_import: error
    unused_local_variable: error
    dead_code: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters
