<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olive Branch Operator Console (sample)</title>
<meta name="description" content="Mockup of the Olive Branch operator console. All data is sample data; nothing here is live.">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

</head>
<body>
<!-- Icon sprite -->

    <symbol id="i-search" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.6 10.6L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-sun" viewBox="0 0 16 16"><circle cx="8" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>

    <symbol id="i-menu" viewBox="0 0 16 16"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-shield" viewBox="0 0 16 16"><path d="M8 1.8l5 1.9v4.2c0 3-2.1 5.2-5 6.3-2.9-1.1-5-3.3-5-6.3V3.7z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M5.8 8l1.7 1.7 2.9-3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 16 16"><path d="M4.5 3l8 5-8 5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-x" viewBox="0 0 16 16"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="i-bookmark" viewBox="0 0 16 16"><path d="M4 2h8v12l-4-3-4 3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="i-clock" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.6V8l2.4 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="n-overview" viewBox="0 0 16 16"><rect x="2" y="2" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="2" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="9" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="9" y="9" width="5" height="5" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="n-health" viewBox="0 0 16 16"><path d="M1.5 8.5h3l1.7-4.5 3 8 1.8-3.5h3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="n-requests" viewBox="0 0 16 16"><path d="M2 5h9M8.5 2.5L11 5 8.5 7.5M14 11H5M7.5 8.5L5 11l2.5 2.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="n-jobs" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 4.2V8l2.8 1.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="n-delivery" viewBox="0 0 16 16"><path d="M2 4.5h12v7H2zM2.4 5l5.6 4 5.6-4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></symbol>
    <symbol id="n-realtime" viewBox="0 0 16 16"><path d="M3 5.5a7 7 0 000 5M13 5.5a7 7 0 010 5M5.5 7a3 3 0 000 2M10.5 7a3 3 0 010 2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="8" r="1" fill="currentColor"/></symbol>
    <symbol id="n-database" viewBox="0 0 16 16"><ellipse cx="8" cy="3.8" rx="5" ry="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M3 3.8v8.4c0 1.1 2.2 2 5 2s5-.9 5-2V3.8M3 8c0 1.1 2.2 2 5 2s5-.9 5-2" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
    <symbol id="n-backups" viewBox="0 0 16 16"><path d="M3 8a5 5 0 109-2.6M12 2v3.4H8.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="n-storage" viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="2" y="9" width="12" height="4" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4.6 5h.1M4.6 11h.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>

    <symbol id="n-audit" viewBox="0 0 16 16"><path d="M4 1.8h6l3 3v9.4H4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M6 8h5M6 10.6h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
    <symbol id="n-tenants" viewBox="0 0 16 16"><circle cx="5.5" cy="5.5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="6.5" r="1.8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M1.5 13c.2-2.4 1.8-3.7 4-3.7s3.8 1.3 4 3.7M10 9.6c2 0 3.3 1.1 3.5 3.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
    <symbol id="n-flags" viewBox="0 0 16 16"><path d="M4 14V2.5M4 3h8l-1.6 2.8L12 8.6H4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="n-incidents" viewBox="0 0 16 16"><path d="M8 1.8l6.2 11.2H1.8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 6.2v3.2M8 11.4v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
    <symbol id="n-capacity" viewBox="0 0 16 16"><path d="M2 13.5h12M4 13.5V9M8 13.5V5M12 13.5V2.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
    <symbol id="n-settings" viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.6v2M8 12.4v2M1.6 8h2M12.4 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M3.5 12.5l1.4-1.4M11.1 4.9l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>

</svg>

<a class="skip" href="#view">Skip to content</a>

<div class="app" id="app">
  <aside class="side" id="side" aria-label="Console sections">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 18C9 18 16 15 20 5c-6-.6-13 2-16 13z" fill="currentColor" opacity=".9"/><path d="M4 20c2-6 6-9 11-11" stroke="var(--surface)" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>
      </span>
      <span class="brand-text"><span class="brand-name">Olive Branch</span><span class="brand-sub">Operator console</span></span>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="side-foot">
      <div class="who">
        <span class="avatar" aria-hidden="true">MO</span>
        <span class="who-text"><strong>m.okafor</strong><span>admin &middot; sample identity</span></span>
      </div>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <div class="main">
    <header class="top" id="top">
      <button class="icon-btn only-narrow" id="navToggle" aria-label="Open navigation" aria-expanded="false" aria-controls="side"><svg width="18" height="18"><use href="#i-menu"/></svg></button>
      <button class="search" id="searchBtn" aria-label="Search or jump to (Control K)">
        <svg width="15" height="15" aria-hidden="true"><use href="#i-search"/></svg>
        <span class="search-text">Search or jump to&hellip;</span>
        <kbd class="hide-narrow">Ctrl K</kbd>
      </button>
      <div class="top-spacer"></div>
      <div class="seg" role="radiogroup" aria-label="Environment" id="envSeg">
        <button role="radio" data-env="dev" aria-checked="false">dev</button>
        <button role="radio" data-env="prod" aria-checked="true">prod</button>
      </div>
      <label class="sel" title="Time range">
        <span class="sr">Time range</span>
        <svg width="14" height="14" aria-hidden="true"><use href="#i-clock"/></svg>
        <select id="rangeSel">
          <option value="1h">Last 1 hour</option>
          <option value="6h">Last 6 hours</option>
          <option value="24h" selected>Last 24 hours</option>
          <option value="7d">Last 7 days</option>
          <option value="30d">Last 30 days</option>
        </select>
      </label>
      <button class="icon-btn" id="viewsBtn" aria-haspopup="dialog" aria-label="Saved views"><svg width="16" height="16"><use href="#i-bookmark"/></svg></button>
      <button class="icon-btn" id="privacyBtn" aria-haspopup="dialog" aria-label="Privacy contract: what operators never see"><svg width="16" height="16"><use href="#i-shield"/></svg></button>
      <button class="icon-btn" id="themeBtn" aria-label="Toggle colour theme"><svg width="16" height="16" id="themeIcon"><use href="#i-moon"/></svg></button>
      <button class="btn danger-ghost hide-narrow" id="declareBtn"><svg width="14" height="14" aria-hidden="true"><use href="#i-warn"/></svg>Declare incident</button>
    </header>
    <div class="sample-bar" role="note">
      <strong>SAMPLE DATA</strong>
      <span>Mockup only. Every number, id and event here is invented; nothing is connected to a server. Each panel says whether its backing is <span class="src src-built">built</span> <span class="src src-partial">partial</span> or <span class="src src-proposed">proposed</span> in the repo.</span>
    </div>
    <div id="incidentBanner"></div>
    <main id="view" tabindex="-1" aria-live="off"></main>
  </div>
</div>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dlgTitle"></dialog>

<script src="data.js"></script>
<script src="console.js"></script>
</body>
</html>
