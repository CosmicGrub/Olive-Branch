<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olive Branch Live Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="overhaul.css">
<style>
/* ---- LIVE page chrome (the devices themselves are styled by overhaul.css + kit.js) ---- */
body{padding-block:14px 48px;overflow-x:hidden}
.wrap{max-width:1280px}
.skip{position:absolute;left:-999px;top:8px;background:var(--panel);color:var(--ink);padding:10px 14px;border-radius:10px;z-index:99;border:2px solid var(--accent)}
.skip:focus{left:12px}
.lh{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
.lh h1{font-size:clamp(1.35rem,3.4vw,1.9rem)}
.lh .sim{display:inline-flex;align-items:center;gap:8px;font:500 .74rem/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:99px;padding:8px 12px}
.lh .sim i{width:8px;height:8px;border-radius:50%;background:var(--warn);display:inline-block}
.vbar{display:flex;gap:6px;flex-wrap:wrap}
.pb{font:700 .86rem/1 var(--font-body);min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--rule);background:var(--panel);color:var(--ink);cursor:pointer}
.pb:hover{background:var(--panel-2)}
.pb[aria-pressed="true"],.pb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.pb.sm{min-height:36px;padding:0 10px;font-size:.8rem}
.pb.warn{border-color:var(--warn);color:var(--warn)}
.pb:disabled{opacity:.5;cursor:not-allowed}
.stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;flex-wrap:wrap;background:var(--bench);border-radius:24px;padding:18px 12px 22px;border:1px solid var(--rule)}
.dcol{display:grid;gap:10px;justify-items:center;min-width:0}
.dcol[hidden]{display:none}
.dcap{min-height:64px;align-content:flex-end;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;justify-content:center;font:500 .72rem/1.2 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dcap b{color:var(--ink);font-weight:500}
.dframe{max-width:100%}
.ob-host{width:100%;height:100%}
/* inside the device */
.ob .live-dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);flex:none}
.ob .tabbar span{position:relative}.ob .tabbar .live-dot{position:absolute;top:6px;right:calc(50% - 20px)}
.ob .tile .live-dot{position:absolute;top:10px;right:10px}.ob .tile{position:relative}
.ob .live-pulse{outline:4px solid var(--accent)!important;outline-offset:3px;border-radius:14px;animation:lpulse .7s ease-out 1}
@keyframes lpulse{0%{outline-color:transparent}30%{outline-color:var(--accent)}100%{outline-color:var(--accent)}}
.ob select.sel{min-height:48px;border-radius:15px;border:1.5px solid var(--edge);background:var(--surface);color:var(--ink);font:700 15px var(--font-body);padding:0 12px;width:100%}
.ob.child select.sel{min-height:64px;font-size:17px}
.ob .bigcode{font:800 38px/1 var(--font-display);letter-spacing:.12em;text-align:center;font-variant-numeric:tabular-nums}
.ob .stateline{font:700 17px/1.35 var(--font-display);letter-spacing:-.01em}
.ob .pill-row{display:flex;gap:8px;flex-wrap:wrap}
.ob .hint-card{background:var(--infoC);color:var(--ink);border-radius:var(--r2);padding:12px 14px;font-size:13.5px;border:1px solid var(--line)}
.ob .swatch{width:64px;height:64px;border-radius:20px;border:3px solid transparent;display:grid;place-items:center;cursor:pointer;color:#fff;box-shadow:var(--shadow1)}
.ob .swatch[aria-checked="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ink)}
.ob .agegrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ob .agegrid button{min-height:64px;border-radius:20px;border:2px solid var(--edge);background:var(--surface);font:800 26px var(--font-display);color:var(--ink);cursor:pointer}
.ob .agegrid button[aria-pressed="true"]{background:var(--pri);color:var(--onPri);border-color:var(--pri)}
.ob .agegrid button:disabled:not([aria-pressed="true"]){opacity:.4}
.ob .hdr-center{text-align:center;display:grid;gap:8px;justify-items:center}
.ob .rolebtn{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;min-height:84px;text-align:left;border-radius:26px;border:2px solid var(--line);background:var(--surface);padding:12px 18px;cursor:pointer;box-shadow:var(--shadow1);font:800 24px var(--font-display);color:var(--ink);width:100%}
.ob .rolebtn:hover{border-color:var(--pri)}
.ob .rolebtn .rav{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--priC);color:var(--onPriC);font:800 24px var(--font-display)}
.ob .linkbtn{background:none;border:0;color:var(--ink2);text-decoration:underline;font:700 14px var(--font-body);min-height:48px;padding:0 10px;cursor:pointer}
/* console */
.console{margin-top:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.cp{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:14px;min-width:0;display:grid;gap:10px;align-content:start}
.cp.wide{grid-column:1/-1}
.cp h2{font-size:.82rem;font-family:var(--font-mono);font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.crow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.clock{font:800 1.5rem/1.1 var(--font-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.csub{font-size:.82rem;color:var(--muted)}
.cp label.rng{display:grid;gap:4px;font-size:.84rem;font-weight:700}
.cp input[type=range]{width:100%;min-height:32px;accent-color:var(--accent)}
.cp select,.cp input[type=text]{min-height:44px;border-radius:10px;border:1.5px solid var(--rule);background:var(--panel-2);color:var(--ink);font:inherit;padding:0 10px;max-width:100%}
.logbox{max-height:240px;overflow:auto;border:1px solid var(--rule);border-radius:12px;background:var(--code-bg);font:400 .74rem/1.45 var(--font-mono)}
.logbox table{border-collapse:collapse;width:100%}
.logbox td,.logbox th{padding:3px 7px;text-align:left;white-space:nowrap;border-bottom:1px solid var(--rule)}
.logbox th{position:sticky;top:0;background:var(--panel-2);font-weight:500;color:var(--muted)}
.logbox .s2{color:var(--ok)}.logbox .s4,.logbox .s5,.logbox .s0{color:var(--bad)}
.insp{max-height:300px;overflow:auto;font:400 .74rem/1.45 var(--font-mono);background:var(--code-bg);border-radius:12px;padding:8px 10px;border:1px solid var(--rule)}
.insp details{margin-left:10px}.insp summary{cursor:pointer;min-height:24px}.insp .k{color:var(--muted)}
.tl2{max-height:240px;overflow:auto;display:grid;gap:3px;font-size:.78rem}
.tl2 div{display:grid;grid-template-columns:auto auto 1fr;gap:8px}
.tl2 .tt{font-family:var(--font-mono);color:var(--muted)}
.cap{position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:60;max-width:min(680px,calc(100vw - 24px));width:max-content;background:var(--ink);color:var(--ground);border-radius:18px;padding:12px 14px;display:grid;gap:8px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.cap[hidden]{display:none}
.cap p{margin:0;font:700 .98rem/1.35 var(--font-body)}
.cap .cs{font:500 .7rem var(--font-mono);letter-spacing:.07em;text-transform:uppercase;opacity:.75}
.cap .crow .pb{background:transparent;color:var(--ground);border-color:rgba(255,255,255,.5)}
.cap .crow .pb:hover{background:rgba(255,255,255,.14)}
.cap .crow .pb.pri{background:var(--ground);color:var(--ink)}
:root[data-theme="dark"] .cap{background:#e4ede5;color:#0f1712}
:root[data-theme="dark"] .cap .crow .pb{color:#0f1712;border-color:rgba(0,0,0,.45)}
:root[data-theme="dark"] .cap .crow .pb.pri{background:#0f1712;color:#e4ede5}
.errbox{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad);border-radius:12px;padding:8px 10px;font:500 .78rem/1.4 var(--font-mono)}
@media (max-width:899px){.stage{flex-direction:column;align-items:center}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<a class="skip" href="#stage">Skip to the prototype</a>
<div class="wrap">
  <header class="lh">
    <div><h1>Olive Branch Live Prototype</h1><div class="csub">Two devices, one family, one virtual clock.</div></div>
    <div id="viewbar" class="vbar" role="group" aria-label="Which devices to show"></div>
    <span class="sim"><i></i>SIMULATION: no real server</span>
  </header>
  <main id="stage" class="stage" tabindex="-1">
    <section class="dcol" id="col-g" aria-label="Guardian phone"><div class="dcap" id="cap-g"></div><div class="dframe" id="frame-g"></div></section>
    <section class="dcol" id="col-k" aria-label="Child tablet"><div class="dcap" id="cap-k"></div><div class="dframe" id="frame-k"></div></section>
  </main>
  <section id="console" class="console" aria-label="Simulation console"></section>
</div>
<div id="caption" class="cap" hidden role="region" aria-label="Walkthrough" aria-live="polite"></div>

<script src="kit.js"></script>
<script src="live-core.js"></script>
<script src="mod-shell.js"></script>
<script src="mod-onboarding.js"></script>
<script src="mod-messages.js"></script>
<script src="mod-guardian.js"></script>
<script src="mod-child.js"></script>
<script src="mod-console.js"></script>
</body>
</html>
