name: verify
# Deliberately NOT `on: [push, pull_request]` -- that fires this whole
# ~14-16 minute suite TWICE for every commit on an open PR branch (once per
# event, same commit, identical result). Measured against this repo's own
# history: 49 of 138 finished runs (35.5%) were exact push/pull_request
# duplicates before this change. `push` is scoped to `main` so a feature
# branch commit is verified exactly once, via `pull_request`; `main` still
# gets its own real post-merge verification via `push`.
on:
  push:
    branches: [main]
  pull_request:

# P-13. A new push to a PR branch supersedes the run still going for the
# previous commit of that SAME ref (that run's result is already stale and it
# burns ~15 runner-minutes finishing). Only pull_request runs are cancelled:
# a `push` to main is the post-merge verification publish-image.yml chains
# off, and one merge landing right after another must not silently cancel the
# earlier commit's verification.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Pinned (not ubuntu-latest): latest became Ubuntu 26.04 in Nov 2026, whose apt installs postgresql-client 18, so
    # tools/verify.sh's PGBIN=/usr/lib/postgresql/16/bin/psql vanished and every database suite aborted with
    # 'Postgres unreachable'. Move this deliberately (and update PGBIN) when the repo is ready for 26.04.
    runs-on: ubuntu-24.04
    # Measured: ~14-16 minutes. A hung step (a wedged livekit-server, a stuck
    # Postgres connection) otherwise holds the runner for GitHub's 6-hour
    # default; 45 minutes is ~3x the real duration.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: olive }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PSQL_CMD: psql postgresql://postgres:postgres@localhost:5432/olive
      PGBIN: /usr/lib/postgresql/16/bin
      PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
          cache-dependency-path: scaffold/package-lock.json
      # The Dart client is analysed and its widget invariants executed.
      # verify.sh treats a missing toolchain as a gap, not a skip.
      #
      # 3.24.5 (this pin's original value) predates Color.withValues()/
      # toARGB32() -- Flutter framework APIs this codebase actually uses
      # (birthday_marked.dart, capture_gate.dart, colour_pick.dart,
      # colouring_screen.dart), not just a pubspec SDK-constraint mismatch.
      # `flutter analyze` failed outright and 52 widget tests failed as a
      # result -- never caught before because this workflow never actually
      # ran until it was moved to the true repo root. Pinned to 3.44.8,
      # the exact version this whole project has actually been built and
      # verified against locally all session.
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.44.8', channel: stable, cache: true }
      # pub packages, keyed on the lockfile: `flutter pub get` below (and the
      # analyze/test steps inside verify.sh) resolve from this instead of
      # re-downloading the same hosted packages every run.
      - uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('scaffold/client/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - run: flutter pub get
        working-directory: scaffold/client
      # Explicit pin, matching the Flutter pin's own discipline right above.
      # tools/verify.sh's own Android gate (client/android/app/build.gradle
      # .kts §5.20) genuinely runs -- confirmed via this repo's own CI logs
      # ("android kotlin compile / wear os compile ... clean"), not the
      # MISSING-TOOLCHAIN fallback its own condition implies when no SDK is
      # present -- because ubuntu-latest runners ship a pre-installed
      # Android SDK and set ANDROID_HOME/ANDROID_SDK_ROOT before any step
      # runs. That pre-installed SDK's platform/build-tools versions are
      # controlled entirely by GitHub's own runner-image rotation, not by
      # this repo, and can drift silently whenever that image changes --
      # the exact reproducibility gap the Flutter pin above exists to
      # close, just for the other toolchain. compileSdk/targetSdk 36 is the
      # real, current value app/build.gradle.kts's own maxOf() floor-guards
      # resolve to under Flutter 3.44.8 (confirmed by reading that file and
      # the pinned Flutter SDK's own FlutterExtension.kt directly); 36.0.0
      # is the matching build-tools release.
      # packages: 'platform-tools' overrides the action's own default
      # ('tools platform-tools') — Google's SDK repository dropped the
      # legacy `tools` package (deprecated since 2019) on 2026-09-14,
      # breaking every consumer of that default with no code change on
      # either side: "Warning: Failed to find package 'tools'" / exit 1,
      # before this workflow's own explicit sdkmanager --install below ever
      # runs. platforms;android-36/build-tools;36.0.0 are already installed
      # explicitly on the next line, so `tools` was never actually needed
      # here — dropping it from the packages list is the fix, not a
      # workaround for anything this repo did.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      # tesseract is a REAL dependency of the homework suite, not a nicety —
      # the OCR assertions shell out to it. imagemagick is a real dependency
      # too: make-fixtures.sh shells out to `magick`/`convert` to generate the
      # OCR test images fresh every run (nothing here is a committed binary) —
      # without it the suite silently reports 0 assertions instead of failing
      # loudly, which is exactly the false-green this project's own verify.sh
      # header says it was written to stop happening.
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client tesseract-ocr imagemagick
      # Pillow is a REAL dependency too: packages/homework/test/gen_ocr_fixture.py
      # generates the real-OCR-quality worksheet images capture-route.test.mjs
      # actually recognizes text from, and it imports PIL directly. Without it
      # the suite's own honest toolchain check (group P) fails loudly with
      # "0 passed, 1 failed" -- caught here for the first time because this
      # is the first CI run this branch's suite ever actually executed on
      # (a GitHub Actions billing block had silently swallowed every earlier
      # run before it could reach this step at all). Installed via apt, not
      # `pip install` -- this runner's system Python is PEP-668 "externally
      # managed" (Ubuntu 24.04), so a bare pip install fails outright;
      # confirmed directly against a matching Ubuntu 24.04 environment
      # before landing this line, not assumed.
      - run: sudo apt-get install -y python3-pil
      # livekit-server is a real dependency of the live suite, not optional.
      # verify.sh treats a missing binary as a gap, not a skip.
      - name: fetch livekit-server
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two independent routes to the same pinned release asset. The public
          # download URL (github.com/.../releases/download/...) answered 504 for
          # every tag for a stretch of 2026-11-08, while the authenticated API
          # route (gh release download) kept working, and an earlier run saved a
          # non-gzip error body as the "tarball" because curl had no -f.
          # -f makes an HTTP error a failure; the gh route is the fallback.
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors -o /tmp/lk.tar.gz \
            https://github.com/livekit/livekit/releases/download/v1.8.0/livekit_1.8.0_linux_amd64.tar.gz \
            || gh release download v1.8.0 -R livekit/livekit -p livekit_1.8.0_linux_amd64.tar.gz -O /tmp/lk.tar.gz --clobber
          tar xzf /tmp/lk.tar.gz -C /tmp
          printf 'port: 7880\nrtc:\n  tcp_port: 7881\n  port_range_start: 50000\n  port_range_end: 50020\n  use_external_ip: false\nkeys:\n  devkey: devsecret_at_least_32_chars_long_xx\nlogging:\n  level: warn\n' > /tmp/lk.yaml
      # Strict (P-13): the old `npm ci || npm install` fell back to a lockfile-
      # IGNORING install whenever package-lock.json drifted from package.json,
      # so CI quietly tested dependency versions nobody had committed.
      - run: npm ci
        working-directory: scaffold

      # db/migrations/0022_backup_reader_role.sql references BOTH app_owner
      # (`ALTER DEFAULT PRIVILEGES FOR ROLE app_owner ...`) and backup_reader
      # by name, and Postgres validates a DDL statement's role names exist
      # regardless of who runs it -- this M1-M4 check connects as the bare
      # `postgres` superuser (PSQL_CMD above), which has never needed either
      # role to exist for any of the first 21 migrations, none of which
      # reference a role by name. 0022 is the first one that does. The real
      # Docker dev/prod flow creates both roles via
      # tools/docker-dev/init-db.sql (mounted as docker-entrypoint-initdb.d,
      # run once against a truly empty volume); tools/verify.sh's own later
      # steps create app_owner again for ITS separate scratch database. This
      # workflow's bare Postgres SERVICE container (above) has no equivalent
      # bootstrap for either, and this M1-M4 check runs before verify.sh ever
      # gets a chance to provision anything -- confirmed live in CI, in two
      # stages (first "role \"backup_reader\" does not exist", then, once
      # that was fixed, "role \"app_owner\" does not exist" one statement
      # later in the same migration). Both created here, mirroring
      # init-db.sql's own real role definitions, before any migration runs.
      - run: |
          psql postgresql://postgres:postgres@localhost:5432/olive -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'app_owner') THEN
              CREATE ROLE app_owner NOSUPERUSER NOBYPASSRLS LOGIN PASSWORD 'app_owner';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'backup_reader') THEN
              CREATE ROLE backup_reader NOSUPERUSER NOCREATEDB NOCREATEROLE BYPASSRLS
                LOGIN PASSWORD 'backup_reader';
            END IF;
          END
          $$;
          SQL

      # M1-M4. Runs twice: the second run must be a clean no-op, which is the
      # idempotency property under test rather than an assumption.
      - run: node tools/migrate.mjs
        working-directory: scaffold
      - run: node tools/migrate.mjs | grep -q 'up to date'
        working-directory: scaffold

      # Computes its own totals, gates on MARKUP correspondence, and fails if
      # any suite reports zero assertions.
      - run: bash tools/verify.sh
        working-directory: scaffold

      # A monitoring view nobody queries is a comment.
      - run: node tools/healthcheck.mjs
        working-directory: scaffold

  # The server image, built for real on every PR (P-16). publish-image.yml only
  # builds it AFTER a merge to main, so before this job a broken Dockerfile was
  # first discovered on main. The smoke checks pin the properties the
  # multi-stage rewrite exists to provide: runtime deps present without dev
  # deps, unprivileged user, no tests/demo/client shipped, version-matched
  # pg_dump for the scheduler's backup job, writable media dir, and a real
  # container that boots and exits 0 on SIGTERM within its stop grace period
  # (the end-to-end proof of the graceful-shutdown fix).
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -t olive-branch:ci scaffold
      - name: Smoke-test the image contents
        run: |
          set -eu
          [ "$(docker run --rm olive-branch:ci id -u)" != "0" ] || { echo "image runs as root"; exit 1; }
          docker run --rm olive-branch:ci pg_dump --version | grep -q ' 16\.'
          docker run --rm olive-branch:ci node -e "Promise.all(['livekit-server-sdk','pg','ws','luxon'].map(m => import(m))).then(() => console.log('runtime deps ok'))"
          docker run --rm olive-branch:ci sh -c 'test -f server/index.mjs && test -f tools/migrate.mjs && test -f db/migrations/0001_phase0_init.sql'
          docker run --rm olive-branch:ci sh -c '! test -e demo && ! test -e client && ! find . -path ./node_modules -prune -o -type d -name test -print | grep -q .'
          docker run --rm olive-branch:ci sh -c 'touch /app/data/media/.w && rm /app/data/media/.w'
          docker run --rm olive-branch:ci sh -c '! test -d node_modules/esbuild && ! test -d node_modules/jsdom'
      # Server-snoop hardening: the image runs NODE_ENV=production, so a deployment
      # that does not say it sits behind a TLS-terminating proxy must refuse to start.
      - name: Production refuses a deployment with no TLS-proxy contract
        run: |
          set +e
          out=$(docker run --rm \
            -e DATABASE_URL=postgres://nobody:nopass@127.0.0.1:9/none \
            -e SESSION_SECRET=eab39cbd1deb88cc188bf88a9188aa8ad58151281e63195d872ef7b4ae12c13d \
            -e MEDIA_SIGNING_SECRET=756dba19238d36cf236ce9b372e0a6ce334c087bb9bc12c1391ca8b096093eac \
            olive-branch:ci 2>&1); rc=$?
          echo "$out"
          [ "$rc" = "2" ] && echo "$out" | grep -q 'PUBLIC_BASE_URL required'

      - name: Boot it, then SIGTERM it
        run: |
          set -eu
          docker run -d --name olive-ci -p 18080:8080 \
            -e DATABASE_URL=postgres://nobody:nopass@127.0.0.1:9/none \
            -e SESSION_SECRET=eab39cbd1deb88cc188bf88a9188aa8ad58151281e63195d872ef7b4ae12c13d \
            -e MEDIA_SIGNING_SECRET=756dba19238d36cf236ce9b372e0a6ce334c087bb9bc12c1391ca8b096093eac \
            -e PUBLIC_BASE_URL=https://olive.example.test -e TRUST_PROXY=1 -e TRUST_PROXY_HOPS=1 \
            olive-branch:ci
          code=000
          for i in $(seq 1 40); do
            # as a TLS-terminating proxy would present it
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'X-Forwarded-Proto: https' http://127.0.0.1:18080/healthz || true)
            [ "$code" = "503" ] && break
            sleep 0.5
          done
          [ "$code" = "503" ] || { echo "server did not answer /healthz (got '$code')"; docker logs olive-ci; exit 1; }
          start=$(date +%s)
          docker stop -t 15 olive-ci
          took=$(( $(date +%s) - start ))
          exit_code=$(docker inspect -f '{{.State.ExitCode}}' olive-ci)
          echo "stopped in ${took}s, exit code ${exit_code}"
          docker logs olive-ci | grep -q 'shutdown: complete'
          [ "$exit_code" = "0" ] && [ "$took" -lt 12 ]
